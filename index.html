<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BI Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bi-logo {
      position: absolute;
      top: 24px;
      left: 32px;
      font-size: 30px;
      font-weight: 800;
      color: #86BC25;
      letter-spacing: 1px;
      z-index: 1000;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      box-sizing: border-box;
    }

    .hero {
      max-width: 900px;
      text-align: center;
    }

    .hero-title {
      font-size: clamp(42px, 7vw, 84px);
      line-height: 1.05;
      font-weight: 800;
      margin: 0 0 20px;
    }

    .green-tagline {
      color: #86BC25;
      display: block;
    }

    .hero-subtitle {
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.6;
      color: #d1d5db;
      max-width: 760px;
      margin: 0 auto 36px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .btn-primary {
      background: #86BC25;
      color: #0f172a;
    }

    .btn-secondary {
      background: transparent;
      color: #ffffff;
      border: 2px solid #86BC25;
    }

    @media (max-width: 768px) {
      .bi-logo {
        top: 18px;
        left: 20px;
        font-size: 24px;
      }

      .hero {
        text-align: center;
      }

      .hero-subtitle {
        font-size: 16px;
      }

      .btn {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>
<body>
  <div class="bi-logo">BI</div>

  <div class="container">
    <section class="hero">
      <h1 class="hero-title">
        <span class="green-tagline">Science of the</span>
        Business
      </h1>

      <p class="hero-subtitle">
        Transform insights into action with a smarter, faster, and more connected business intelligence experience.
      </p>

      <div class="button-group">
        <button class="btn btn-primary" id="registerBtn">Register</button>
        <button class="btn btn-secondary">Learn More</button>
      </div>
    </section>
  </div>
</body>
</html>
